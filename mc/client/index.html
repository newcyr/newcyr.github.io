<!DOCTYPE html>
<html style="width:100%;height:100%;background-color:black;">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
		<meta name="description" content="EaglercraftX 1.8.8 - 浏览器里直接玩 Minecraft" />
		<title>EaglercraftX 1.8.8 - 网页版 Minecraft</title>
		<link type="image/png" rel="shortcut icon" href="favicon.png" />
		<script type="text/javascript">
			"use strict";

			/* 游戏基础资源优先从 GitHub 镜像站拉取，减少对原站的依赖；
			   用 fetch + Blob 加载 classes.js，避免镜像站 text/plain + nosniff 导致脚本被浏览器拒绝执行。
			   多个镜像依次尝试，全部失败才回落到原站（GitHub Pages 同目录）。 */
			var ORIGIN = "https://raw.githubusercontent.com/newcyr/newcyr.github.io/main/mc/client/";
			var MIRRORS = [
				{ name: "镜像 A", base: "https://gh-proxy.com/" + ORIGIN },
				{ name: "镜像 B", base: "https://ghfast.top/" + ORIGIN },
				{ name: "原站", base: "" }
			];

			var IDLE_TIMEOUT = 25000;

			function normalizeServerAddr(addr) {
				addr = String(addr).trim();
				if (!/^wss?:\/\//i.test(addr)) addr = "ws://" + addr;
				if (addr.indexOf("/", 8) === -1) addr += "/";
				addr = addr.replace(/\/+$/, "") + "/";
				return addr;
			}

			function bootMsg(text) {
				var el = document.getElementById("boot-msg");
				if (el) el.textContent = text;
			}

			function mb(n) {
				return (n / 1048576).toFixed(1) + " MB";
			}

			var started = false;

			/* 记住上一次可用的镜像，下次优先使用 */
			try {
				var saved = window.localStorage.getItem("mc_client_mirror");
				if (saved) {
					for (var k = 0; k < MIRRORS.length; k++) {
						if (MIRRORS[k].base === saved) {
							var picked = MIRRORS.splice(k, 1)[0];
							MIRRORS.unshift(picked);
							break;
						}
					}
				}
			} catch (e) {}

			function startGame(base) {
				if (started) return;
				started = true;

				var q = window.location.search;
				var join = null;
				if ((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
					q = new window.URLSearchParams(q);
					var s = q.get("server") || q.get("joinServer");
					if (s) join = normalizeServerAddr(s);
				}

				window.eaglercraftXOpts = {
					lang: "zh_CN",
					demoMode: false,
					allowUpdateSvc: false,
					allowFNAWSkins: false,
					container: "game_frame",
					assetsURI: base + "assets.epk",
					localesURI: base + "lang/",
					worldsDB: "worlds",
					servers: [
						// 本地测试服（页面用 http 打开时生效；https 页面请用 ?server=wss://... 形式）
						{ addr: "ws://127.0.0.1:8081/", name: "NewCyr 本机服务端 (8081)" }
					],
					relays: []
				};
				if (join) window.eaglercraftXOpts.joinServer = join;

				var boot = document.getElementById("boot");
				if (boot && boot.parentNode) boot.parentNode.removeChild(boot);

				main();
			}

			/* 下载 classes.js，带空闲超时与进度提示 */
			function downloadScript(url, label, onProgress) {
				return new Promise(function (resolve, reject) {
					var settled = false;
					var idleTimer = null;

					function fail(err) {
						if (settled) return;
						settled = true;
						clearTimeout(idleTimer);
						try { controller.abort(); } catch (e) {}
						reject(err);
					}
					function resetIdle() {
						clearTimeout(idleTimer);
						idleTimer = setTimeout(function () { fail(new Error("下载超时")); }, IDLE_TIMEOUT);
					}

					var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
					resetIdle();

					fetch(url, {
						signal: controller ? controller.signal : undefined,
						credentials: "omit",
						referrerPolicy: "no-referrer"
					})
						.then(function (res) {
							if (!res.ok) throw new Error("HTTP " + res.status);
							var total = parseInt(res.headers.get("content-length") || "0", 10);
							var reader = res.body && res.body.getReader ? res.body.getReader() : null;

							if (!reader) {
								return res.blob().then(function (blob) {
									onProgress(blob.size, total);
									return { blob: blob, size: blob.size };
								});
							}

							var chunks = [];
							var received = 0;
							var lastPaint = 0;

							function pump() {
								return reader.read().then(function (r) {
									if (r.done) return { chunks: chunks, size: received };
									resetIdle();
									chunks.push(r.value);
									received += r.value.length;
									var now = Date.now();
									if (now - lastPaint > 300) {
										lastPaint = now;
										onProgress(received, total);
									}
									return pump();
								});
							}
							return pump().then(function (out) {
								onProgress(out.size, total);
								return { chunks: out.chunks, size: out.size };
							});
						})
						.then(function (out) {
							if (settled) return;
							var blob;
							if (out.chunks) {
								var head = "";
								try { head = new TextDecoder("utf-8").decode(out.chunks[0].slice(0, 200)); } catch (e) {}
								if (out.size < 5 * 1048576) throw new Error("文件不完整（" + mb(out.size) + "）");
								if (head && head.indexOf("<html") !== -1) throw new Error("镜像返回了错误页面");
								blob = new Blob(out.chunks, { type: "text/javascript" });
							} else {
								if (out.size < 5 * 1048576) throw new Error("文件不完整（" + mb(out.size) + "）");
								blob = new Blob([out.blob], { type: "text/javascript" });
							}
							settled = true;
							clearTimeout(idleTimer);
							resolve(blob);
						})
						.catch(fail);
				});
			}

			/* 单镜像测速：只读取前 256KB 后中断，按实测吞吐量评分 */
			function probeMirror(m) {
				return new Promise(function (resolve) {
					var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
					var settled = false;
					function done(score) {
						if (settled) return;
						settled = true;
						resolve({ m: m, score: score });
					}
					var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
					var timer = setTimeout(function () {
						try { if (controller) controller.abort(); } catch (e) {}
						done(-1);
					}, 12000);

					fetch(m.base + "classes.js", {
						signal: controller ? controller.signal : undefined,
						credentials: "omit",
						referrerPolicy: "no-referrer"
					})
						.then(function (res) {
							if (!res.ok) throw new Error("HTTP " + res.status);
							var now = function () { return (window.performance && performance.now) ? performance.now() : Date.now(); };
							if (!res.body || !res.body.getReader) {
								return res.blob().then(function (b) {
									clearTimeout(timer);
									done(b.size / Math.max(1, now() - t0));
								});
							}
							var reader = res.body.getReader();
							var bytes = 0;
							function pump() {
								return reader.read().then(function (r) {
									if (r.done) {
										clearTimeout(timer);
										done(bytes / Math.max(1, now() - t0));
										return;
									}
									bytes += r.value.length;
									if (bytes >= 262144) {
										try { reader.cancel(); } catch (e) {}
										clearTimeout(timer);
										done(bytes / Math.max(1, now() - t0));
										return;
									}
									return pump();
								});
							}
							return pump();
						})
						.catch(function () { clearTimeout(timer); done(-1); });
				});
			}

			function loadFrom(list, i) {
				if (i >= list.length) {
					bootMsg("资源加载失败，请检查网络后刷新页面");
					return;
				}
				var m = list[i];
				bootMsg("正在从" + m.name + "下载游戏资源…");
				downloadScript(m.base + "classes.js", m.name, function (got, total) {
					bootMsg("正在从" + m.name + "下载游戏资源… " + mb(got) + (total && total >= got ? " / " + mb(total) : ""));
				})
					.then(function (blob) {
						var url = URL.createObjectURL(blob);
						var script = document.createElement("script");
						script.type = "text/javascript";
						script.src = url;
						script.onload = function () {
							URL.revokeObjectURL(url);
							try { window.localStorage.setItem("mc_client_mirror", m.base); } catch (e) {}
							startGame(m.base);
						};
						script.onerror = function () {
							URL.revokeObjectURL(url);
							bootMsg(m.name + "脚本执行失败，切换下一个来源…");
							setTimeout(function () { loadFrom(list, i + 1); }, 0);
						};
						document.head.appendChild(script);
					})
					.catch(function () {
						bootMsg(m.name + "不可用，正在切换下一个来源…");
						setTimeout(function () { loadFrom(list, i + 1); }, 300);
					});
			}

			/* 所有镜像并发测速，默认使用实测最快的镜像；镜像全部失败才回落到原站 */
			function startWithFastestMirror() {
				var mirrors = [];
				var origin = [];
				for (var i = 0; i < MIRRORS.length; i++) {
					if (MIRRORS[i].base) mirrors.push(MIRRORS[i]);
					else origin.push(MIRRORS[i]);
				}
				bootMsg("正在测试各镜像站速度…");
				Promise.all(mirrors.map(probeMirror)).then(function (results) {
					var good = results.filter(function (r) { return r.score > 0; });
					good.sort(function (a, b) { return b.score - a.score; });
					if (!good.length) {
						bootMsg("镜像站均不可用，改用原站…");
						loadFrom(origin, 0);
						return;
					}
					var best = good[0];
					bootMsg("最快镜像：" + best.m.name + "（" + (best.score * 1000 / 1048576).toFixed(2) + " MB/s），开始下载…");
					var order = good.map(function (r) { return r.m; }).concat(origin);
					loadFrom(order, 0);
				});
			}

			window.addEventListener("load", function () {
				if (window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
					return;
				}
				startWithFastestMirror();
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
		<div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;color:#9df3c2;font-family:'Microsoft YaHei',system-ui,sans-serif;z-index:9">
			<div style="font-size:15px;letter-spacing:.5px">NewCyr 网页版我的世界</div>
			<div id="boot-msg" style="font-size:13px;color:#8fb3a1">正在加载游戏资源…</div>
			<div style="font-size:12px;color:#5f7f6e">首次加载约 35MB，请耐心等待</div>
		</div>
	</body>
</html>
