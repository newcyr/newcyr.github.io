<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>作业答案中心 · NEWCYR</title>
<meta id="metaDesc" name="description" content="NEWCYR 作业答案中心：选择试卷，查看题目与参考答案。">
<meta name="theme-color" id="themeColor" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230B5CFF'/%3E%3Cstop offset='1' stop-color='%233B82F6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 44V20l24 24V20' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

</head>
<body>

<!-- ======================= HEADER ======================= -->
<header class="site-header" id="header">
  <div class="shell nav-wrap">
    <a class="brand" href="./" aria-label="作业答案中心首页">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 22.5v-13l13 13v-13"/></svg>
      </span>
      <span class="brand-text"><b>NEWCYR</b><small>Answer Works</small></span>
    </a>

    <nav class="nav-links" id="navLinks" aria-label="主导航">
      <a class="is-active" href="index.html" data-zh="试卷中心" data-en="Papers">试卷中心</a>
      <a href="admin/" data-zh="后台管理" data-en="Admin">后台管理</a>
      <a href="../" data-zh="返回官网" data-en="Main site">返回官网</a>
    </nav>

    <div class="nav-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn is-active" type="button" data-lang="zh" aria-pressed="true">中</button>
        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="icon-btn theme-btn" type="button" aria-label="切换亮暗主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="navLinks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="btn btn-primary nav-cta" href="#papers">
        <span data-zh="选择试卷" data-en="Browse">选择试卷</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/></svg>
      </a>
    </div>
  </div>
</header>

<main id="main">
  <!-- ======================= HERO ======================= -->
  <section class="page-hero" id="top">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="shell">
      <span class="eyebrow"><i></i><span data-zh="作业答案 · 逐题解析" data-en="Homework answers · step by step">作业答案 · 逐题解析</span></span>
      <h1 data-zh="选择一份试卷，<br><em>直接看题目与答案</em>。" data-en="Pick a paper,<br><em>see questions and answers</em>.">选择一份试卷，<br><em>直接看题目与答案</em>。</h1>
      <p class="hero-sub" id="heroSub" data-zh="题目支持文字与图片。部分试卷可按题查看答案，部分试卷直接展示整卷参考答案。" data-en="Questions can be text or images. Some papers reveal answers question by question, others show the full answered paper.">题目支持文字与图片。部分试卷可按题查看答案，部分试卷直接展示整卷参考答案。</p>

      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索试卷、学科或关键词" autocomplete="off" aria-label="搜索试卷">
        </label>
        <div class="chip-row" id="subjectChips"></div>
      </div>
    </div>
  </section>

  <!-- ======================= STATS ======================= -->
  <section class="stats" aria-label="统计">
    <div class="shell stats-grid">
      <div class="stat"><b id="statPapers">0</b><span data-zh="试卷" data-en="Papers">试卷</span></div>
      <div class="stat"><b id="statQuestions">0</b><span data-zh="题目" data-en="Questions">题目</span></div>
      <div class="stat"><b id="statSubjects">0</b><span data-zh="学科" data-en="Subjects">学科</span></div>
      <div class="stat"><b id="statUpdated">—</b><span data-zh="最近更新" data-en="Updated">最近更新</span></div>
    </div>
  </section>

  <!-- ======================= PAPERS ======================= -->
  <section class="section" id="papers">
    <div class="shell">
      <div class="sec-head">
        <div>
          <span class="kicker" data-zh="Papers" data-en="Papers">Papers</span>
          <h2 class="sec-title" data-zh="全部<em>试卷</em>" data-en="All <em>papers</em>">全部<em>试卷</em></h2>
        </div>
        <span class="count-note" id="countNote"></span>
      </div>
      <div class="paper-grid" id="paperGrid"></div>
      <div id="paperState"></div>
      <div class="notice-bar" id="siteNotice" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.4"/></svg>
        <span id="siteNoticeText"></span>
      </div>
    </div>
  </section>
</main>

<!-- ======================= FOOTER ======================= -->

  <div class="shell">
    <div class="foot-main">
      <div class="foot-brand">
        <a class="brand" href="./" aria-label="作业答案中心首页">
          <span class="brand-mark">
            <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 22.5v-13l13 13v-13"/></svg>
          </span>
          <span class="brand-text"><b>NEWCYR</b><small>Answer Works</small></span>
        </a>
        <p data-zh="作业答案与试卷归档。纯静态、无需安装，支持逐题或整卷查看答案。" data-en="Homework answers and paper archive. Static, no install, answers by question or by whole paper.">作业答案与试卷归档。纯静态、无需安装，支持逐题或整卷查看答案。</p>
      </div>
      <div class="foot-col">
        <h5 data-zh="试卷" data-en="Papers">试卷</h5>
        <a href="index.html" data-zh="试卷中心" data-en="All papers">试卷中心</a>
        <a href="admin/" data-zh="后台管理" data-en="Admin">后台管理</a>
        <a href="../" data-zh="返回官网" data-en="Main site">返回官网</a>
        <a href="https://github.com/newcyr" target="_blank" rel="noopener">GitHub</a>
      </div>
      <div class="foot-col">
        <h5 data-zh="偏好" data-en="Preferences">偏好</h5>
        <button type="button" class="theme-btn" data-zh="切换亮暗主题" data-en="Toggle light / dark">切换亮暗主题</button>
        <button type="button" data-set-lang="zh" data-zh="中文界面" data-en="Chinese UI">中文界面</button>
        <button type="button" data-set-lang="en" data-zh="English UI" data-en="English UI">English UI</button>
        <a href="#top" data-zh="回到顶部" data-en="Back to top">回到顶部</a>
      </div>
    </div>
    <div class="foot-bot">
      <span>© <span id="year">2026</span> NEWCYR · <span data-zh="保留所有权利" data-en="All rights reserved">保留所有权利</span></span>
      <span>
        <span data-zh="由 GitHub Pages 托管" data-en="Hosted on GitHub Pages">由 GitHub Pages 托管</span>
        <span class="sep" aria-hidden="true"></span>
        <span>HTML · CSS · JavaScript</span>
      </span>

  </div>
