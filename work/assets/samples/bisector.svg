<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="等腰三角形与角平分线示意图">
  <rect width="600" height="420" fill="#F6F8FC" rx="18"/>
  <g fill="none" stroke="#0b5cff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
