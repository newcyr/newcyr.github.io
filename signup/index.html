<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册 · NEWCYR</title>
<script>
try { var t = localStorage.getItem('newcyr.theme'); document.documentElement.dataset.theme = (t === 'dark' ? 'dark' : 'light'); } catch (e) {}
</script>
<meta name="description" content="注册 NEWCYR 账号：注册后自动登录，凭证全站通用，有效期 30 天。" />
<link rel="stylesheet" href="../auth/page.css" />
</head>
<body>
<header class="site-header">
  <div class="shell nav-wrap">
    <a class="brand" href="../index.html" aria-label="NEWCYR 首页">
      <span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 22.5v-13l13 13v-13"/></svg></span>
      <span class="brand-text"><b>NEWCYR</b><small>Independent Works</small></span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">首页</a>
      <a href="../mc/">我的世界</a>
      <a href="../login/">登录</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="切换亮暗主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
      </button>
      <a class="btn btn-primary btn-sm" href="../login/">已有账号</a>
    </div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-stage">
    <section class="hero-copy">
      <span class="eyebrow"><span class="dot"></span>注册即用</span>
      <h1>创建账号，<br />马上进入<em>方块世界</em>。</h1>
      <p>只需一个邮箱和一个密码，注册完成后自动登录。账号资料只保存在本机后端，站点不存储任何密码。</p>
      <ul class="hero-points">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>无需邮箱验证，注册后立即生效</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>头像、昵称、简介可在个人中心修改</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>登录凭证有效期 30 天</li>
      </ul>
    </section>

    <div class="card">
      <h2>创建账号</h2>
      <p class="sub">注册后自动登录并跳转</p>

      <form id="form-register">
        <div class="field">
          <label for="r-email">邮箱</label>
          <input id="r-email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="r-nickname">昵称</label>
          <input id="r-nickname" type="text" maxlength="16" placeholder="留空则使用邮箱前缀" />
        </div>
        <div class="field">
          <label for="r-password">密码</label>
          <input id="r-password" type="password" autocomplete="new-password" placeholder="6-64 位，建议包含字母与数字" required />
        </div>
        <div class="field">
          <label for="r-password2">确认密码</label>
          <input id="r-password2" type="password" autocomplete="new-password" placeholder="再次输入密码" required />
        </div>
        <button class="btn btn-primary form-btn" type="submit" id="btn-register">注册并登录</button>
        <p class="msg" id="msg-register"></p>
      </form>

      <div class="backend">
        <p class="backend-title">注册服务 <span class="badge" id="backend-state">检测中</span></p>
        <div class="backend-row">
          <input id="backend-input" type="text" placeholder="自动获取中…" />
          <button class="btn btn-ghost btn-sm" type="button" id="btn-save-backend">保存</button>
        </div>
        <p class="hint">注册需要本机后端在线（数据写入 D:\newcyr\data\accounts.json）。地址会从站点自动读取，也可手动指定。</p>
      </div>

      <div class="divider">已有账号</div>
      <p class="foot-link"><a href="../login/" id="link-login">直接登录</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="shell foot-bot">
    <span>© 2026 NEWCYR · 账号体系</span>
    <span><a href="../index.html">返回首页</a></span>
  </div>
</footer>

<script src="../mc/assets/auth.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '../mc/';
  if (next.charAt(0) !== '/' || next.slice(0, 2) === '//') next = '../mc/';

  document.getElementById('link-login').href = '../login/?next=' + encodeURIComponent(next);

  var themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = cur;
    try { localStorage.setItem('newcyr.theme', cur); } catch (e) {}
  });

  var msg = document.getElementById('msg-register');
  function setMsg(text, type) {
    msg.textContent = text || '';
    msg.className = 'msg' + (type ? ' ' + type : '');
  }

  var backendInput = document.getElementById('backend-input');
  var state = document.getElementById('backend-state');

  function healthCheck() {
    var base = MCAuth.backendBase();
    backendInput.value = base;
    state.textContent = '检测中';
    state.className = 'badge';
    fetch(base + '/api/public/server', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(); state.textContent = '在线'; state.className = 'badge online'; })
      .catch(function () { state.textContent = '离线'; state.className = 'badge offline'; });
  }

  MCAuth.discoverBackend().then(healthCheck, healthCheck);

  document.getElementById('btn-save-backend').addEventListener('click', function () {
    var url = backendInput.value.trim();
    if (!/^https?:\/\/[^\s]+$/.test(url)) { setMsg('后台地址需以 http:// 或 https:// 开头', 'err'); return; }
    MCAuth.setBackendBase(url);
    healthCheck();
    setMsg('后台地址已保存', 'ok');
  });

  document.getElementById('form-register').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('r-email').value.trim().toLowerCase();
    var nickname = document.getElementById('r-nickname').value.trim();
    var password = document.getElementById('r-password').value;
    var password2 = document.getElementById('r-password2').value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg('邮箱格式不正确', 'err'); return; }
    if (password.length < 6 || password.length > 64) { setMsg('密码长度需为 6-64 位', 'err'); return; }
    if (password !== password2) { setMsg('两次输入的密码不一致', 'err'); return; }

    var btn = document.getElementById('btn-register');
    btn.disabled = true;
    setMsg('正在创建账号…');
    try {
      await MCAuth.register(email, password, nickname);
      setMsg('注册成功，正在进入联机大厅…', 'ok');
      setTimeout(function () { location.href = next; }, 800);
    } catch (err) {
      if (err.offline) {
        setMsg('无法连接注册服务（' + MCAuth.backendBase() + '），请确认后台已启动，或在下方填写正确的后台地址', 'err');
      } else {
        setMsg(err.message, 'err');
      }
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
