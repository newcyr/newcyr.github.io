<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · NEWCYR</title>
<script>
try { var t = localStorage.getItem('newcyr.theme'); document.documentElement.dataset.theme = (t === 'dark' ? 'dark' : 'light'); } catch (e) {}
</script>
<meta name="description" content="NEWCYR 账号登录：邮箱密码或邮箱验证码，登录凭证全站通用，有效期 30 天。" />
<link rel="stylesheet" href="../auth/page.css" />
</head>
<body>
<header class="site-header">
  <div class="shell nav-wrap">
    <a class="brand" href="../index.html" aria-label="NEWCYR 首页">
      <span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 22.5v-13l13 13v-13"/></svg></span>
      <span class="brand-text"><b>NEWCYR</b><small>Independent Works</small></span>
    </a>
    <nav class="nav-links">
      <a href="../index.html">首页</a>
      <a href="../mc/">我的世界</a>
      <a href="../signup/">注册</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="切换亮暗主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
      </button>
      <a class="btn btn-primary btn-sm" href="../signup/">注册账号</a>
    </div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-stage">
    <section class="hero-copy">
      <span class="eyebrow"><span class="dot"></span>一次登录 · 全站通用</span>
      <h1>登录后，<br />在<em>浏览器里直接联机</em>。</h1>
      <p>账号与凭证由本机后端统一管理，登录一次即可漫游整个站点。凭证缓存 30 天，后台暂时离线也不会丢失。</p>
      <ul class="hero-points">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>支持邮箱 + 密码、邮箱验证码两种方式</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>只保存登录凭证，不上传任何密码</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>登录后进入网页端联机大厅</li>
      </ul>
    </section>

    <div class="card">
      <h2>登录账号</h2>
      <p class="sub" id="card-sub">使用邮箱登录 NEWCYR</p>

      <div class="session" id="session" style="display:none">
        <span>已登录：<b id="session-name"></b></span>
        <button class="btn btn-ghost btn-sm" type="button" id="btn-continue">继续</button>
        <button class="btn btn-ghost btn-sm" type="button" id="btn-switch">切换账号</button>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" type="button" data-tab="password">邮箱 + 密码</button>
        <button class="tab" type="button" data-tab="code">邮箱验证码</button>
      </div>

      <form id="form-password">
        <div class="field">
          <label for="p-email">邮箱</label>
          <input id="p-email" type="email" autocomplete="username" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="p-password">密码</label>
          <input id="p-password" type="password" autocomplete="current-password" placeholder="请输入登录密码" required />
        </div>
        <button class="btn btn-primary form-btn" type="submit" id="btn-password">登录</button>
        <p class="msg" id="msg-password"></p>
      </form>

      <form id="form-code" style="display:none">
        <div class="field">
          <label for="c-email">邮箱</label>
          <input id="c-email" type="email" autocomplete="username" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="c-code">验证码</label>
          <div class="code-row">
            <input id="c-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字验证码" required />
            <button class="btn btn-ghost btn-sm" type="button" id="btn-send-code">发送验证码</button>
          </div>
        </div>
        <button class="btn btn-primary form-btn" type="submit" id="btn-code">验证并登录</button>
        <p class="msg" id="msg-code"></p>
      </form>

      <div class="backend">
        <p class="backend-title">登录服务 <span class="badge" id="backend-state">检测中</span></p>
        <div class="backend-row">
          <input id="backend-input" type="text" placeholder="自动获取中…" />
          <button class="btn btn-ghost btn-sm" type="button" id="btn-save-backend">保存</button>
        </div>
        <p class="hint" id="backend-hint">页面会从站点自动读取后台地址；如需手动指定，填写后点保存即可。</p>
      </div>

      <div class="divider">还没有账号</div>
      <p class="foot-link"><a href="../signup/" id="link-signup">立即注册</a></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="shell foot-bot">
    <span>© 2026 NEWCYR · 账号体系</span>
    <span><a href="../index.html">返回首页</a></span>
  </div>
</footer>

<script src="../mc/assets/auth.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '../mc/';
  if (next.charAt(0) !== '/' || next.slice(0, 2) === '//') next = '../mc/';

  document.getElementById('link-signup').href = '../signup/?next=' + encodeURIComponent(next);

  /* 主题切换 */
  var themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = cur;
    try { localStorage.setItem('newcyr.theme', cur); } catch (e) {}
  });

  function setMsg(id, text, type) {
    var el = document.getElementById(id);
    el.textContent = text || '';
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  /* 已登录状态 */
  var existing = MCAuth.readAuth();
  if (existing) {
    var box = document.getElementById('session');
    box.style.display = 'flex';
    document.getElementById('session-name').textContent = existing.nickname + '（' + existing.email + '）';
    document.getElementById('btn-continue').addEventListener('click', function () { location.href = next; });
    document.getElementById('btn-switch').addEventListener('click', function () {
      MCAuth.logout();
      box.style.display = 'none';
    });
  }

  /* 后台地址：自动发现 + 手动覆盖 */
  var backendInput = document.getElementById('backend-input');
  var state = document.getElementById('backend-state');

  function healthCheck() {
    var base = MCAuth.backendBase();
    backendInput.value = base;
    state.textContent = '检测中';
    state.className = 'badge';
    fetch(base + '/api/public/server', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(); state.textContent = '在线'; state.className = 'badge online'; })
      .catch(function () { state.textContent = '离线'; state.className = 'badge offline'; });
  }

  MCAuth.discoverBackend().then(healthCheck, healthCheck);

  document.getElementById('btn-save-backend').addEventListener('click', function () {
    var url = backendInput.value.trim();
    if (!/^https?:\/\/[^\s]+$/.test(url)) { setMsg('msg-password', '后台地址需以 http:// 或 https:// 开头', 'err'); return; }
    MCAuth.setBackendBase(url);
    healthCheck();
    setMsg('msg-password', '后台地址已保存', 'ok');
  });

  /* 切换登录方式 */
  document.getElementById('tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
    var isPwd = tab.dataset.tab === 'password';
    document.getElementById('form-password').style.display = isPwd ? '' : 'none';
    document.getElementById('form-code').style.display = isPwd ? 'none' : '';
  });

  /* 密码登录 */
  document.getElementById('form-password').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn-password');
    btn.disabled = true;
    setMsg('msg-password', '正在验证…');
    try {
      await MCAuth.loginPassword(document.getElementById('p-email').value, document.getElementById('p-password').value);
      setMsg('msg-password', '登录成功，正在跳转…', 'ok');
      setTimeout(function () { location.href = next; }, 600);
    } catch (err) {
      setMsg('msg-password', err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  });

  /* 验证码登录 */
  var countdown = 0;
  var timer = null;
  var sendBtn = document.getElementById('btn-send-code');

  function tick() {
    if (countdown <= 0) { sendBtn.textContent = '发送验证码'; sendBtn.disabled = false; clearInterval(timer); return; }
    sendBtn.textContent = countdown + ' 秒后重发';
    countdown -= 1;
  }

  sendBtn.addEventListener('click', async function () {
    var email = document.getElementById('c-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg('msg-code', '请先填写正确的邮箱', 'err'); return; }
    sendBtn.disabled = true;
    setMsg('msg-code', '正在发送验证码…');
    try {
      await MCAuth.sendCode(email);
      setMsg('msg-code', '验证码已发送至邮箱，5 分钟内有效', 'ok');
      countdown = 60;
      timer = setInterval(tick, 1000);
    } catch (err) {
      setMsg('msg-code', err.message, 'err');
      sendBtn.disabled = false;
    }
  });

  document.getElementById('form-code').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btn-code');
    btn.disabled = true;
    setMsg('msg-code', '正在校验验证码…');
    try {
      await MCAuth.loginCode(document.getElementById('c-email').value, document.getElementById('c-code').value);
      setMsg('msg-code', '登录成功，正在跳转…', 'ok');
      setTimeout(function () { location.href = next; }, 600);
    } catch (err) {
      setMsg('msg-code', err.message, 'err');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
